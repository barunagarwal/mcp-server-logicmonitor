# Description: Run tests on pull requests and pushes.
# Description: Validates code quality with linting and pytest.

name: Test

on:
  push:
    branches: [main, build]
  pull_request:
    branches: [main]

permissions:
  contents: read

# A newer push to a pull request supersedes its running checks; pushes to main
# and build always run to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    # Without this, uv follows .python-version and every leg runs 3.11.
    env:
      UV_PYTHON: ${{ matrix.python-version }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0
        with:
          version: "0.9.27"
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Run linter
        run: uv run ruff check src tests

      - name: Check formatting
        run: uv run ruff format --check src tests

      # Fails when mypy's error count rises above mypy-baseline.txt. Only the 3.11
      # leg runs it: pyproject.toml pins mypy to python_version 3.11, and the numpy
      # the 3.12 and 3.13 legs install ships stubs mypy cannot parse at 3.11.
      - name: Type check (ratchet)
        if: matrix.python-version == '3.11'
        run: uv run python scripts/mypy_ratchet.py

      - name: Run tests
        run: uv run pytest tests/ -v --tb=short

      # Generated artifacts must be committed alongside tool changes. The suite
      # already compares them, but this step names the fix instead of surfacing
      # an opaque assertion failure.
      - name: Check generated files are up to date
        run: |
          uv run python tests/test_tool_contract.py
          uv run python tests/test_tools_doc.py
          if ! git diff --quiet -- tests/fixtures/tool_list.json documentation/tools.md; then
            echo "::error::Generated files are out of date. Run:"
            echo "  uv run python tests/test_tool_contract.py"
            echo "  uv run python tests/test_tools_doc.py"
            echo "and commit the result."
            git diff --stat -- tests/fixtures/tool_list.json documentation/tools.md
            exit 1
          fi

  # The huggingface extra's tests skip in the matrix, which does not install it.
  # This leg installs it with CPU torch: every version comes from uv.lock through
  # an exported constraints file, and only torch's build is the CPU wheel, since
  # uv sync has no torch backend and --locked would pull the CUDA wheels.
  huggingface:
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.11"

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0
        with:
          version: "0.9.27"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Install the huggingface extra with CPU torch
        run: |
          uv export --locked --no-dev --extra huggingface --no-emit-project --no-hashes \
            --no-header -o "$RUNNER_TEMP/huggingface-constraints.txt"
          uv pip install --torch-backend cpu -c "$RUNNER_TEMP/huggingface-constraints.txt" \
            -e ".[huggingface]"

      # --no-sync keeps uv run from syncing the environment back to the lock.
      - name: Run huggingface tests
        run: uv run --no-sync pytest tests/test_client/test_huggingface.py -v --tb=short

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0
        with:
          version: "0.9.27"

      - name: Build package
        run: uv build

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/
