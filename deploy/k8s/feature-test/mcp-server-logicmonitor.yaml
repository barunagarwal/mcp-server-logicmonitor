apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-server-logicmonitor
  namespace: feature-test
  labels:
    app: mcp-server-logicmonitor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-server-logicmonitor
  template:
    metadata:
      labels:
        app: mcp-server-logicmonitor
    spec:
      containers:
      - name: mcp-server-logicmonitor
        image: eu.gcr.io/dexda-non-production/mcp-server-logicmonitor:main
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        env:
        - name: LM_TRANSPORT
          value: http
        - name: LM_HTTP_HOST
          value: 0.0.0.0
        - name: LM_HTTP_PORT
          value: "8080"
        - name: LM_PORTAL
          value: qauat01.logicmonitor.com
        - name: LM_CREDENTIALS_JSON
          valueFrom:
            secretKeyRef:
              name: topology-feature-lmv1-token
              key: test-feature
        - name: LM_ENABLE_WRITE_OPERATIONS
          value: "false"
        - name: LM_LOG_LEVEL
          value: warning
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /readyz
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
          failureThreshold: 3
        resources:
          requests:
            cpu: 250m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-server-logicmonitor
  namespace: feature-test
  labels:
    app: mcp-server-logicmonitor
spec:
  type: ClusterIP
  selector:
    app: mcp-server-logicmonitor
  ports:
  - name: http
    port: 8080
    targetPort: http
    protocol: TCP
