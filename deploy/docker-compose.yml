# Description: Docker Compose configuration for LogicMonitor MCP server.
# Description: Includes optional Caddy reverse proxy for TLS termination.

services:
  lm-mcp:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: lm-mcp-server:latest
    container_name: lm-mcp
    ports:
      # Bound to loopback by default: this is the plaintext listener, and it is
      # published regardless of the tls profile, so binding it to every
      # interface would send bearer tokens in cleartext to anyone who reaches
      # the host. Caddy is unaffected -- it reaches this service over the
      # compose network, not through the published port. To serve plaintext to
      # other hosts deliberately, set LM_HTTP_BIND=0.0.0.0.
      - "${LM_HTTP_BIND:-127.0.0.1}:${LM_HTTP_PORT:-8080}:8080"
    environment:
      - LM_PORTAL=${LM_PORTAL}
      - LM_BEARER_TOKEN=${LM_BEARER_TOKEN}
      - LM_ACCESS_ID=${LM_ACCESS_ID:-}
      - LM_ACCESS_KEY=${LM_ACCESS_KEY:-}
      - LM_TRANSPORT=http
      - LM_HTTP_HOST=0.0.0.0
      - LM_HTTP_PORT=8080
      - LM_ENABLE_WRITE_OPERATIONS=${LM_ENABLE_WRITE_OPERATIONS:-false}
      - LM_CORS_ORIGINS=${LM_CORS_ORIGINS:-}
      - LM_HTTP_AUTH_TOKEN=${LM_HTTP_AUTH_TOKEN:-}
      - LM_SESSION_ENABLED=${LM_SESSION_ENABLED:-true}
      - LM_FIELD_VALIDATION=${LM_FIELD_VALIDATION:-warn}
    healthcheck:
      test: ["CMD", "python", "-c", "import os, sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:%s/healthz' % os.environ.get('LM_HTTP_PORT', '8080'), timeout=5).status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    networks:
      - lm-mcp-net

  # Optional: TLS termination with Caddy
  # Enable with: docker compose --profile tls up
  caddy:
    # caddy:2.11-alpine (2.11.7), digest read from Docker Hub 2026-10-21
    image: caddy:2.11-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    container_name: lm-mcp-proxy
    ports:
      - "443:443"
      - "80:80"
    environment:
      - DOMAIN=${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      lm-mcp:
        condition: service_healthy
    profiles:
      - tls
    networks:
      - lm-mcp-net

networks:
  lm-mcp-net:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
